<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Личный кабинет — SHAMIL | CHINA</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3efe7;
      color: #171717;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100vh;
      padding: 24px 18px 50px;
    }

    .top {
      max-width: 520px;
      margin: 0 auto 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .back {
      font-size: 13px;
      opacity: .65;
      white-space: nowrap;
    }

    .account-card {
      max-width: 520px;
      margin: 0 auto;
      background: #fffdf8;
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.07);
    }

    .kicker {
      font-size: 11px;
      letter-spacing: 1.8px;
      opacity: .5;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 0 0 28px;
      line-height: 1.5;
      font-size: 14px;
      opacity: .62;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #ece7dd;
      border-radius: 15px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab {
      border: 0;
      padding: 12px;
      border-radius: 12px;
      background: transparent;
      font-size: 14px;
      cursor: pointer;
    }

    .tab.active {
      background: #171717;
      color: white;
    }

    .form { display: none; }
    .form.active { display: block; }

    label {
      display: block;
      font-size: 12px;
      margin: 17px 0 7px;
      opacity: .7;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #d8d1c6;
      background: white;
      border-radius: 14px;
      outline: none;
      font-size: 16px;
    }

    input:focus { border-color: #171717; }

    .main-btn {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: 0;
      border-radius: 15px;
      background: #171717;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .main-btn:disabled { opacity: .5; }

    .status {
      font-size: 13px;
      line-height: 1.45;
      margin-top: 16px;
      min-height: 18px;
    }

    .status.ok { color: #17763a; }
    .status.err { color: #b42318; }

    #profileView { display: none; }

    .member-badge {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 100px;
      background: #171717;
      color: white;
      font-size: 11px;
      letter-spacing: 1.4px;
      margin: 12px 0 24px;
    }

    .bonus-card {
      background: #171717;
      color: white;
      border-radius: 23px;
      padding: 23px;
      margin-top: 8px;
    }

    .bonus-label {
      font-size: 11px;
      letter-spacing: 1.4px;
      opacity: .6;
    }

    .bonus-number {
      margin-top: 8px;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .bonus-word {
      font-size: 13px;
      opacity: .6;
    }

    .profile-info {
      margin-top: 24px;
      border-top: 1px solid #e4ded4;
    }

    .info-row {
      padding: 16px 0;
      border-bottom: 1px solid #e4ded4;
    }

    .info-label {
      display: block;
      font-size: 10px;
      letter-spacing: 1.2px;
      opacity: .45;
      margin-bottom: 6px;
    }

    .info-value {
      font-size: 15px;
      font-weight: 600;
    }

    .logout {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border-radius: 15px;
      background: transparent;
      border: 1px solid #cfc8bd;
      font-size: 14px;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      padding: 30px 0;
      opacity: .5;
    }
    /* ===== SHAMIL MEMBERS — ITALIAN LUXURY ===== */

body{
  background:
    radial-gradient(circle at 85% 8%, #3a291c 0, transparent 26%),
    linear-gradient(180deg,#17120e 0%,#0e0b08 100%) !important;
  color:#f3eadc !important;
}

.page{
  padding-top:calc(24px + env(safe-area-inset-top)) !important;
}

.top{
  color:#f3eadc !important;
}

.brand{
  color:#f3eadc !important;
  letter-spacing:.04em;
}

.back{
  color:#c9a15e !important;
}

.account-card{
  background:#f2e8d8 !important;
  color:#24170d !important;
  border:1px solid rgba(201,161,94,.35) !important;
  box-shadow:0 28px 70px rgba(0,0,0,.35) !important;
}

.kicker{
  color:#9b7946 !important;
}

.account-card h1{
  color:#24170d !important;
  font-family:Georgia,"Times New Roman",serif !important;
  font-weight:500 !important;
}

.subtitle{
  color:#716457 !important;
}

.tabs{
  background:rgba(94,67,43,.08) !important;
  border:1px solid rgba(155,121,70,.20) !important;
}

.tab{
  color:#725d45 !important;
}

.tab.active{
  background:linear-gradient(135deg,#d8b878,#b98b52) !important;
  color:#24170d !important;
}

.form label{
  color:#8b755d !important;
}

.form input{
  background:#fffaf2 !important;
  color:#24170d !important;
  border:1px solid rgba(155,121,70,.30) !important;
}

.form input:focus{
  border-color:#c9a15e !important;
  box-shadow:0 0 0 3px rgba(201,161,94,.12) !important;
}

.main-btn{
  background:linear-gradient(135deg,#d8b878,#b98b52) !important;
  color:#24170d !important;
  border:0 !important;
  box-shadow:0 10px 24px rgba(0,0,0,.18) !important;
}

.logout{
  color:#8b6b43 !important;
  border-color:rgba(155,121,70,.35) !important;
}
    /* ===== ORDERS ===== */

.orders-section{
  margin-top:22px;
  padding-top:20px;
  border-top:1px solid rgba(90,65,40,.14);
}

.orders-title{
  margin-bottom:12px;
  font-size:11px;
  font-weight:700;
  letter-spacing:1.8px;
  color:#9a7448;
}

.orders-empty{
  padding:18px;
  border:1px solid rgba(90,65,40,.12);
  border-radius:16px;
  background:rgba(255,255,255,.28);
  color:#786a5c;
  font-size:13px;
  text-align:center;
}

.order-item{
  padding:16px;
  margin-bottom:10px;
  border:1px solid rgba(90,65,40,.12);
  border-radius:16px;
  background:rgba(255,255,255,.30);
}

.order-brand{
  margin-bottom:5px;
  font-size:10px;
  font-weight:700;
  letter-spacing:1.4px;
  color:#a17b4d;
}

.order-name{
  font-family:Georgia,serif;
  font-size:18px;
  color:#2b2119;
}

.order-meta{
  margin-top:8px;
  font-size:12px;
  color:#74675b;
}

.order-bonus{
  margin-top:7px;
  font-size:12px;
  font-weight:700;
  color:#9a7448;
}
  </style>
</head>

<body>
  <div class="page">
    <div class="top">
      <a class="brand" href="/">SHAMIL | CHINA 🇨🇳</a>
      <a class="back" href="/">← На главную</a>
    </div>

    <div class="account-card">
      <div id="loadingView" class="loading">Загружаем…</div>

      <div id="authView" style="display:none;">
        <div class="kicker">SHAMIL MEMBERS</div>
        <h1>Личный кабинет</h1>
        <p class="subtitle">
          Регистрируйся, копи бонусы и получай преимущества постоянного клиента.
        </p>

        <div class="tabs">
          <button id="loginTab" class="tab active" type="button">Войти</button>
          <button id="registerTab" class="tab" type="button">Регистрация</button>
        </div>

        <div id="loginForm" class="form active">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" placeholder="example@mail.com" autocomplete="email">

          <label for="loginPassword">Пароль</label>
          <input id="loginPassword" type="password" placeholder="Ваш пароль" autocomplete="current-password">

          <button id="loginBtn" class="main-btn" type="button">Войти</button>
          <div id="loginStatus" class="status"></div>
        </div>

        <div id="registerForm" class="form">
          <label for="registerName">Имя</label>
          <input id="registerName" type="text" placeholder="Ваше имя" autocomplete="name">

          <label for="registerEmail">Email</label>
          <input id="registerEmail" type="email" placeholder="example@mail.com" autocomplete="email">

          <label for="registerPassword">Пароль</label>
          <input id="registerPassword" type="password" placeholder="Минимум 6 символов" autocomplete="new-password">

          <button id="registerBtn" class="main-btn" type="button">Создать аккаунт</button>
          <div id="registerStatus" class="status"></div>
        </div>

        <div id="verifyForm" class="form">
          <label for="verifyCode">Код из письма</label>
          <input id="verifyCode" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Введите код">

          <button id="verifyBtn" class="main-btn" type="button">Подтвердить email</button>
          <div id="verifyStatus" class="status"></div>
        </div>
      </div>

      <div id="profileView">
        <div class="kicker">SHAMIL MEMBERS</div>
        <h1 id="profileName">Мой аккаунт</h1>
        <div id="memberLevel" class="member-badge">START MEMBER</div>

        <div class="bonus-card">
          <div class="bonus-label">БОНУСНЫЙ БАЛАНС</div>
          <div id="bonusBalance" class="bonus-number">0</div>
          <div class="bonus-word">бонусов</div>
        </div>

        <div class="profile-info">
          <div class="info-row">
            <span class="info-label">EMAIL</span>
            <div id="profileEmail" class="info-value"></div>
          </div>

          <div class="info-row">
            <span class="info-label">УРОВЕНЬ</span>
            <div id="profileLevel" class="info-value">START</div>
          </div>

          <div class="info-row">
            <span class="info-label">СУММА ПОКУПОК</span>
            <div id="totalSpent" class="info-value">0 ₽</div>
          </div>
          <div id="ordersSection" class="orders-section">
  <div class="orders-title">МОИ ЗАКАЗЫ</div>
  <div id="ordersList">
    <div class="orders-empty">Загружаем заказы...</div>
  </div>
</div>
        </div>

        <button id="pushBtn" class="main-btn" type="button">🔔 Включить уведомления</button>
        <div id="pushStatus" class="status"></div>

        <button id="logoutBtn" class="logout" type="button">Выйти из аккаунта</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://pnsldiahjlnazouskkxk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_b212Q_Wc9-7C97UlreEj8A_O3JEcoJQ';

    const client = window.client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);

    let pendingVerifyEmail = '';

    function setStatus(el, text = '', type = '') {
      if (!el) return;
      el.textContent = text;
      el.className = 'status' + (type ? ' ' + type : '');
    }

    function showAuth() {
      $('loadingView').style.display = 'none';
      $('profileView').style.display = 'none';
      $('authView').style.display = 'block';
    }

    function showLoading() {
      $('loadingView').style.display = 'block';
      $('profileView').style.display = 'none';
      $('authView').style.display = 'none';
    }

    function switchToLogin() {
      $('loginTab').classList.add('active');
      $('registerTab').classList.remove('active');
      $('loginForm').classList.add('active');
      $('registerForm').classList.remove('active');
      $('verifyForm').classList.remove('active');
    }

    function switchToRegister() {
      $('registerTab').classList.add('active');
      $('loginTab').classList.remove('active');
      $('registerForm').classList.add('active');
      $('loginForm').classList.remove('active');
      $('verifyForm').classList.remove('active');
    }

    $('loginTab').onclick = switchToLogin;
    $('registerTab').onclick = switchToRegister;

    async function showProfile() {
      showLoading();

      try {
        const { data: userData, error: userError } = await client.auth.getUser();

        if (userError) throw userError;

        const user = userData?.user;

        if (!user) {
          showAuth();
          return;
        }

        const { data: profile, error: profileError } = await client
          .from('profiles')
          .select('name, bonus_balance, total_spent, member_level')
          .eq('id', user.id)
          .maybeSingle();

        if (profileError) {
          console.error('Profile error:', profileError);
        }

        const name = profile?.name || user.user_metadata?.name || 'Мой аккаунт';
        const level = profile?.member_level || 'START';

        $('profileName').textContent = name;
        $('profileEmail').textContent = user.email || '';
        $('bonusBalance').textContent =
          Number(profile?.bonus_balance || 0).toLocaleString('ru-RU');
        $('memberLevel').textContent = level + ' MEMBER';
        $('profileLevel').textContent = level;
        $('totalSpent').textContent =
          Number(profile?.total_spent || 0).toLocaleString('ru-RU') + ' ₽';

        $('loadingView').style.display = 'none';
        $('authView').style.display = 'none';
        $('profileView').style.display = 'block';
      } catch (error) {
        console.error('Account load error:', error);
        showAuth();
      }
    }

    $('registerBtn').onclick = async () => {
      const name = $('registerName').value.trim();
      const email = $('registerEmail').value.trim();
      const password = $('registerPassword').value;

      if (!name || !email || !password) {
        setStatus($('registerStatus'), 'Заполни все поля.', 'err');
        return;
      }

      if (password.length < 6) {
        setStatus(
          $('registerStatus'),
          'Пароль должен содержать минимум 6 символов.',
          'err'
        );
        return;
      }

      $('registerBtn').disabled = true;
      setStatus($('registerStatus'), 'Создаём аккаунт…');

      try {
        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: { data: { name } }
        });

        if (error) {
          const message =
            (error.message || '').toLowerCase().includes('already registered')
              ? 'Не удалось зарегистрировать аккаунт. Возможно, этот email уже используется. Попробуйте войти в аккаунт.'
              : 'Не удалось зарегистрировать аккаунт. Проверь данные и попробуй ещё раз.';

          setStatus($('registerStatus'), message, 'err');
          return;
        }

        if (data.session) {
          await showProfile();
          return;
        }

        pendingVerifyEmail = email;
        $('registerForm').classList.remove('active');
        $('verifyForm').classList.add('active');

        setStatus(
          $('verifyStatus'),
          'Если этот email новый — код подтверждения отправлен. Если аккаунт уже существует — попробуйте войти.',
          'ok'
        );
      } catch (error) {
        console.error('Signup error:', error);
        setStatus(
          $('registerStatus'),
          'Не удалось зарегистрироваться. Попробуйте ещё раз.',
          'err'
        );
      } finally {
        $('registerBtn').disabled = false;
      }
    };

    $('verifyBtn').onclick = async () => {
      const token = $('verifyCode').value.trim();

      if (!pendingVerifyEmail || !token) {
        setStatus($('verifyStatus'), 'Введите код из письма.', 'err');
        return;
      }

      $('verifyBtn').disabled = true;
      setStatus($('verifyStatus'), 'Проверяем код…');

      try {
        const { error } = await client.auth.verifyOtp({
          email: pendingVerifyEmail,
          token,
          type: 'signup'
        });

        if (error) {
          setStatus($('verifyStatus'), 'Неверный или просроченный код.', 'err');
          return;
        }

        setStatus($('verifyStatus'), 'Email подтверждён ✅', 'ok');
        window.location.reload();
      } catch (error) {
        console.error('Verify error:', error);
        setStatus($('verifyStatus'), 'Не удалось проверить код.', 'err');
      } finally {
        $('verifyBtn').disabled = false;
      }
    };

    $('loginBtn').onclick = async () => {
      const email = $('loginEmail').value.trim();
      const password = $('loginPassword').value;

      if (!email || !password) {
        setStatus($('loginStatus'), 'Введи email и пароль.', 'err');
        return;
      }

      $('loginBtn').disabled = true;
      setStatus($('loginStatus'), 'Входим…');

      try {
        const { error } = await client.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          setStatus($('loginStatus'), 'Неверный email или пароль.', 'err');
          return;
        }

        await showProfile();
      } catch (error) {
        console.error('Login error:', error);
        setStatus($('loginStatus'), 'Не удалось войти. Попробуйте ещё раз.', 'err');
      } finally {
        $('loginBtn').disabled = false;
      }
    };

    $('logoutBtn').onclick = async () => {
      try {
        await client.auth.signOut();
      } catch (error) {
        console.error('Logout error:', error);
      }

      switchToLogin();
      showAuth();
    };

    showProfile();
  </script>
  <script src="/push.js"></script>
</body>
</html>
